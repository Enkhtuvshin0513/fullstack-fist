<!DOCTYPE html>
<html>
  <style>
    input {
      width: 200px;
    }
  </style>
  <h1>Register form</h1>

  <form id="login-form">
    <input type="email" name="email" placeholder="enter your email" required />
    <input
      type="password"
      name="password"
      placeholder="enter your password"
      required
    />
    <input
      type="password"
      name="passwordValidation"
      placeholder="enter your password again"
      required
    />
    <button type="submit">Register</button>
  </form>

  <button onclick="goLoging()">Go login</button>

  <script>
    const goLoging = () => {
      window.location.replace("/");
    };
  </script>
</html>
